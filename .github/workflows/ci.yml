name: 測試

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 單機規則與語系
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"
          cache: npm
      - run: npm ci
      - run: npm test
  browser:
    name: 瀏覽器操作與版面
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 瀏覽器操作檢查（自訂元件、設定彈窗、單機整局）
        run: node scripts/browser-check.js
