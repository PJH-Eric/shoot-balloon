name: 佈署前端到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個佈署。不取消跑到一半的那一次 —— Pages 佈署被砍在中間會留下半套的站台，
# 寧可排隊等它跑完。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 建置前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"

      - name: 規則單元測試（沒過就不佈署）
        run: node tests/verify.js

      - name: 準備靜態檔案
        run: |
          touch public/.nojekyll
          cp public/index.html public/404.html   # 直接開子路徑時也回到遊戲

      # enablement: true 讓這一步在 repo 還沒開 Pages 時自己去開（並把來源設成
      # GitHub Actions），省掉手動進 Settings 的步驟。沒開就跑會直接 404 失敗。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 驗證並注入 GA4 與 SEO
        run: node tests/seo.js && node scripts/inject-seo.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: 佈署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
